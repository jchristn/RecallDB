apiVersion: 1

providers:
  - name: RecallDB
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    # Place every RecallDB dashboard under a single top-level "RecallDB" folder in Grafana rather than
    # spreading them across one folder per subdirectory. The on-disk subdirectories (HTTP, MCP, Application,
    # Search, Database, Runtime) are retained for source organization but are collapsed into this one folder.
    folder: RecallDB
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
